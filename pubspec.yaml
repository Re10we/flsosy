name: flsosy
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  flutter_bloc: ^8.1.3
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.5
  google_fonts: ^6.2.1 # For Inter font
  http: ^1.2.1
  infinite_scroll_pagination: ^5.1.1
  fl_chart: ^0.69.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: any

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/home/
    - assets/bottom_navigation/
    - .env

flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  field_prefix: ''
  filename: assets.dart